# social-agent（Super Social Agent）对外入口 —— x.broly.ai
# 用途：给 X OAuth 提供一个【公网可达 + 正规 HTTPS】的固定回调地址，并把前端整站对外。
#   · /api/*   → 后端 8091（含 X 真回调 GET /api/connections/x/callback，X 直接重定向浏览器过来）
#   · /media/* → 后端 8091（本地 FS 落盘图片静态服务）
#   · /*       → 前端 Next 3001（页面 + 其 /bff、/media 反代仍照常）
# 证书复用现成 *.broly.ai（Amazon 正规签发，到 2026-11）。零碰其它 server_name 的 block。
# 前端是 next dev（HMR 走 websocket），故 location / 带 Upgrade 头。

server {
    listen 80;
    server_name x.broly.ai;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name x.broly.ai;

    ssl_certificate     /etc/nginx/ssl/test.crt;
    ssl_certificate_key /etc/nginx/ssl/test.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # 后端 API（含 X OAuth 回调）→ Hono 8091。CORS 交给后端，不重复加头。
    location /api/ {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 本地媒体静态 → 后端 8091。
    location /media/ {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 前端（Next dev 3001）+ 其 /bff、/media 反代。带 Upgrade 头以支持 HMR websocket。
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }
}
